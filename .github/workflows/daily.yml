name: Daily Breadth Signal

on:
  schedule:
    # 北京时间 14:48 ≈ UTC 06:48，周一到周五
    - cron: '48 6 * * 1-5'
  workflow_dispatch:   # 允许手动触发

permissions:
  contents: write      # 允许把历史文件写回仓库

jobs:
  run-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run signal script
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO:   ${{ secrets.MAIL_TO }}
        run: python signal.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history_breadth.csv
          git diff --quiet && git diff --staged --quiet || git commit -m "update breadth history $(date +%Y-%m-%d)"
          git push
